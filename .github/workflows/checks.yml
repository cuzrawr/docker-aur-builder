name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell checks
        run: |
          for script in *.sh tests/*.sh; do bash -n "$script"; done
          shellcheck -s bash *.sh makepkg-container.conf tests/*.sh
      - name: Portable tests
        run: python3 tests/test_builder.py Launcher Retry
